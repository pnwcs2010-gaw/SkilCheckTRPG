<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG Custom Skill Check Online</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h1, h2 { text-align: center; color: #fff; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; }
        button { background: #d9534f; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #c9302c; }
        button.secondary { background: #337ab7; }
        button.secondary:hover { background: #286090; }
        .screen { display: none; }
        .screen.active { display: block; }
        .player-item { background: #2a2a2a; padding: 8px 12px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; }
        
        /* สไตล์สำหรับกล่อง Skill Check */
        #skillcheck-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center; z-index: 999;
        }
        canvas { background: transparent; }
        #feedback-text { position: absolute; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าจอเข้าสู่ระบบ / สร้างห้อง -->
    <div id="screen-login" class="screen active">
        <h1>DBD Custom Skill Check</h1>
        <input type="text" id="input-name" placeholder="ชื่อของคุณ" value="Player">
        <button id="btn-create" class="secondary">สร้างห้องใหม่ (Host)</button>
        <hr style="border-color: #444; margin: 20px 0;">
        <input type="text" id="input-room" placeholder="รหัสห้อง 5 หลัก">
        <button id="btn-join">เข้าร่วมห้อง</button>
    </div>

    <!-- หน้าจอควบคุมสำหรับ Host -->
    <div id="screen-host" class="screen">
        <h2>แดชบอร์ดหัวหน้าห้อง</h2>
        <p>รหัสห้อง: <strong id="display-room-code" style="color: #ffcc00; font-size: 24px;"></strong></p>
        
        <div style="background: #252525; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <h3>ตั้งค่าสกิลเช็ค</h3>
            
            <label>ความเร็วเข็ม (Speed): <span id="val-speed" style="color: #ffcc00; font-weight: bold;">3</span></label>
            <input type="range" id="setting-speed" min="1" max="5" value="3" oninput="document.getElementById('val-speed').innerText = this.value">
            
            <label style="margin-top: 10px; display: block;">ขนาดโซนสำเร็จ (Size multiplier): <span id="val-size" style="color: #ffcc00; font-weight: bold;">1</span>x</label>
            <input type="range" id="setting-size" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('val-size').innerText = this.value">
            
            <label style="margin-top: 10px; display: block;">จำนวนครั้งที่ต้องกด (Count): <span id="val-count" style="color: #ffcc00; font-weight: bold;">1</span> ครั้ง</label>
            <input type="range" id="setting-count" min="1" max="12" value="1" oninput="document.getElementById('val-count').innerText = this.value">
            
            <label style="margin-top: 10px; display: block;">ส่งไปที่:</label>
            <select id="setting-target">
                <option value="all">ทุกคนในห้อง</option>
            </select>
            
            <button id="btn-trigger" style="background: #5cb85c; margin-top: 15px;">ส่งสกิลเช็ค!</button>
        </div>

        <h3>รายชื่อผู้เล่นในห้อง</h3>
        <div id="player-list"></div>
        <div id="live-feed" style="margin-top: 15px; font-size: 14px; color: #aaa;"></div>
    </div>

    <!-- หน้าจอรอลูกห้อง -->
    <div id="screen-waiting" class="screen">
        <h2>รอหัวหน้าห้องเริ่มสกิลเช็ค...</h2>
        <p>ห้อง: <strong id="waiting-room-code"></strong></p>
        <h3>รายชื่อเพื่อนร่วมห้อง:</h3>
        <div id="waiting-player-list"></div>
    </div>
</div>

<!-- หน้าต่างแสดงวงกลม Skill Check เมื่อถูกส่งมา -->
<div id="skillcheck-overlay">
    <div style="position: relative; display: flex; justify-content: center; align-items: center;">
        <canvas id="sc-canvas" width="300" height="300"></canvas>
        <div id="feedback-text"></div>
    </div>
</div>

<!-- Socket.io Client Library -->
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoom = null;
    let myName = '';
    let isHost = false;

    // ตัวแปรควบคุมระบบ Skill Check Canvas
    let scActive = false;
    let scAngle = 0;
    let scSpeed = 1;
    let scSuccessStart = 0;
    let scSuccessEnd = 0;
    let scPerfectStart = 0;
    let scPerfectEnd = 0;
    let scRemainingCount = 1;
    let scTotalCount = 1;
    let animationFrameId = null;
    let timeoutId = null;
    
    // ตัวแปรสำหรับระบบหลายจุดในวงเดียว
    let scZones = [];
    let currentTargetZoneIndex = 0;

    // รับคำสั่งเปิดสกิลเช็คจาก Host
    socket.on('trigger-skillcheck', (settings) => {
        if (timeoutId) clearTimeout(timeoutId);
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        scSpeed = settings.speed;
        scTotalCount = settings.count;
        scRemainingCount = scTotalCount;
        startSingleSkillCheck(settings.size);
    });

    function startSingleSkillCheck(sizeMultiplier) {
        if (timeoutId) clearTimeout(timeoutId);
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        const overlay = document.getElementById('skillcheck-overlay');
        overlay.style.display = 'flex';
        overlay.style.pointerEvents = 'auto';
        
        const fbEl = document.getElementById('feedback-text');
        if (fbEl) fbEl.innerText = '';

        scActive = true;
        scAngle = 0; // เริ่มต้นที่มุม 0
        currentTargetZoneIndex = 0;
        scZones = [];

        // สุ่มสร้างโซนเป้าหมาย 2 จุดในวงเดียวกัน
        const zoneWidth = (Math.PI / 3) * sizeMultiplier;
        const perfectWidth = Math.PI / 10;

        // จุดที่ 1
        let start1 = 1.0 + Math.random() * 1.0;
        let end1 = start1 + zoneWidth;
        scZones.push({
            start: start1,
            end: end1,
            perfectStart: start1 + (zoneWidth / 2) - (perfectWidth / 2),
            perfectEnd: start1 + (zoneWidth / 2) + (perfectWidth / 2),
            hit: false
        });

        // จุดที่ 2 (เว้นระยะห่างจากจุดแรก)
        let start2 = end1 + 1.2 + Math.random() * 1.0;
        let end2 = start2 + zoneWidth;
        // ป้องกันไม่ให้เกินวงกลมเต็ม (2Pi)
        if (end2 < Math.PI * 5.5) {
            scZones.push({
                start: start2,
                end: end2,
                perfectStart: start2 + (zoneWidth / 2) - (perfectWidth / 2),
                perfectEnd: start2 + (zoneWidth / 2) + (perfectWidth / 2),
                hit: false
            });
        }

        runSkillCheckLoop();
    }

    function runSkillCheckLoop() {
        if (!scActive) return;
        const canvas = document.getElementById('sc-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 90;

        // 1. วงกลมพื้นหลัง
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.lineWidth = 8;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.stroke();

        // 2. วาดทุกโซนเป้าหมายในวง
        scZones.forEach((zone, idx) => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, zone.start, zone.end);
            ctx.lineWidth = 12;
            // ถ้าจุดไหนถูกกดโดนแล้วเปลี่ยนเป็นสีเขียว ถ้ายังไม่โดนและถึงคิวจะเป็นสีขาว
            if (zone.hit) {
                ctx.strokeStyle = '#2ecc71';
            } else if (idx === currentTargetZoneIndex) {
                ctx.strokeStyle = '#ffffff';
            } else {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            }
            ctx.stroke();

            // วาดโซน Perfect (สีเหลืองทองเฉพาะจุดที่ยังไม่โดน)
            if (!zone.hit) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, zone.perfectStart, zone.perfectEnd);
                ctx.lineWidth = 14;
                ctx.strokeStyle = '#ffcc00';
                ctx.stroke();
            }
        });

        // 3. วาดเข็มนาฬิกา
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        const needleX = centerX + Math.cos(scAngle) * (radius - 5);
        const needleY = centerY + Math.sin(scAngle) * (radius - 5);
        ctx.lineTo(needleX, needleY);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#e74c3c';
        ctx.stroke();

        let currentAngle = scAngle % (Math.PI * 2);
        if (currentAngle < 0) currentAngle += Math.PI * 2;

        // เช็คว่าถ้าเข็มกวาดเลยโซนที่ต้องกดไปแล้วโดยผู้เล่นไม่ยอมกด -> ถือว่า FAIL ทอดทิ้ง
        let targetZone = scZones[currentTargetZoneIndex];
        if (targetZone && !targetZone.hit && currentAngle > targetZone.end) {
            endSkillCheck('FAIL');
            return;
        }

        // หมุนเข็มเพิ่มขึ้นเรื่อยๆ (ใช้ความเร็วที่หารสเกลแล้ว)
        const currentSpeed = parseFloat(document.getElementById('setting-speed').value) || 1;
        const actualSpeed = currentSpeed * 0.5;
        scAngle += actualSpeed * 0.012;

        // ถ้าเข็มหมุนครบรอบวง (เกิน 2Pi) และจัดการครบทุกจุดแล้ว
        if (scAngle > Math.PI * 2) {
            // ถ้ายังเคลียร์ไม่ครบทุกจุดแล้วหลุดรอบวง
            if (currentTargetZoneIndex < scZones.length) {
                endSkillCheck('FAIL');
                return;
            }
        }

        animationFrameId = requestAnimationFrame(runSkillCheckLoop);
    }

    function handlePlayerInput() {
        if (!scActive) return;

        let currentAngle = scAngle % (Math.PI * 2);
        if (currentAngle < 0) currentAngle += Math.PI * 2;

        let targetZone = scZones[currentTargetZoneIndex];
        
        // ถ้ากดตอนที่ไม่อยู่ในโซนเป้าหมายปัจจุบัน หรือไม่มีโซนเหลือแล้ว -> FAIL
        if (!targetZone || currentAngle < targetZone.start || currentAngle > targetZone.end) {
            endSkillCheck('FAIL');
            return;
        }

        // เช็คว่าโดนโซน Perfect หรือ Success ปกติ
        let hitResult = 'SUCCESS';
        if (currentAngle >= targetZone.perfectStart && currentAngle <= targetZone.perfectEnd) {
            hitResult = 'PERFECT!';
        }

        // ทำเครื่องหมายว่าจุดนี้โดนแล้ว
        targetZone.hit = true;
        currentTargetZoneIndex++;

        // ถ้าเก็บครบทุกจุดในวงแล้ว จบรอบนี้ทันทีด้วยความสำเร็จ
        if (currentTargetZoneIndex >= scZones.length) {
            endSkillCheck(hitResult);
        } else {
            // แจ้งเตือนสั้นๆ ว่าผ่านจุดแรกแล้ว ให้เตรียมกดจุดถัดไป
            const fbEl = document.getElementById('feedback-text');
            if (fbEl) {
                fbEl.innerText = `HIT (${currentTargetZoneIndex}/${scZones.length})`;
                fbEl.style.color = '#ffcc00';
            }
        }
    }

    function endSkillCheck(result) {
        scActive = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        const fbEl = document.getElementById('feedback-text');
        if (fbEl) {
            fbEl.innerText = result;
            fbEl.style.color = result === 'FAIL' ? '#d9534f' : (result === 'PERFECT!' ? '#ffcc00' : '#5cb85c');
        }

        socket.emit('skillcheck-result', { roomId: currentRoom, result, playerName: myName });

        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
            scRemainingCount--;
            if (scRemainingCount > 0 && result !== 'FAIL') {
                startSingleSkillCheck(parseFloat(document.getElementById('setting-size').value));
            } else {
                const overlay = document.getElementById('skillcheck-overlay');
                overlay.style.display = 'none';
                overlay.style.pointerEvents = 'none';
            }
        }, 800);
    }

    // รองรับการกด Spacebar บนคอมพิวเตอร์
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && scActive) {
            e.preventDefault();
            handlePlayerInput();
        }
    });

    // รองรับการแตะหน้าจอบบนมือถือ
    const overlayEl = document.getElementById('skillcheck-overlay');
    if (overlayEl) {
        overlayEl.addEventListener('click', () => {
            if (scActive) {
                handlePlayerInput();
            }
        });
    };
</script>

</body>
</html>
